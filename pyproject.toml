[project]
name = "handle-insurances"
version = "0.1.0"
description = ""
authors = [
    {name = "techdoodle"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.139.2,<0.140.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
